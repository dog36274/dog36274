<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Desk</title>
<!--CHARTJS--><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f4f2; --surface: #fcfcfb; --border: #e3e2dd;
    --text: #0b0b0b; --text-2: #52514e; --text-3: #85847e; --grid: #ebeae6;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
    --good: #0f7b4b; --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #111110; --surface: #1a1a19; --border: #2c2c2a;
      --text: #ffffff; --text-2: #c3c2b7; --text-3: #8f8e85; --grid: #2a2a28;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70;
      --good: #4cc38a; --bad: #f2867f;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #111110; --surface: #1a1a19; --border: #2c2c2a;
    --text: #ffffff; --text-2: #c3c2b7; --text-3: #8f8e85; --grid: #2a2a28;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --good: #4cc38a; --bad: #f2867f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: .02em; }
  .sub { color: var(--text-2); font-size: 12px; }
  .streak { display: flex; align-items: baseline; gap: 8px; background: var(--surface); border: 1px solid var(--border);
            border-radius: 12px; padding: 8px 16px; }
  .streak b { font-size: 34px; font-variant-numeric: tabular-nums; line-height: 1; }
  .streak span { color: var(--text-2); font-size: 12px; }
  .banner { background: var(--surface); border: 1px solid var(--s2); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; font-size: 13px; }
  .toolbar { display: flex; gap: 6px; margin: 0 0 12px; align-items: center; flex-wrap: wrap; }
  .toolbar .lbl { color: var(--text-2); font-size: 12px; margin-right: 4px; }
  button { font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border);
           background: var(--surface); color: var(--text-2); cursor: pointer; }
  button[aria-pressed="true"] { color: var(--text); border-color: var(--text-3); font-weight: 600; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .card h2 { margin: 0 0 2px; font-size: 16px; }
  .tp { color: var(--text-2); margin: 0 0 12px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .tile { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  .tile .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile .k { font-size: 11px; color: var(--text-2); }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
  .chart h3 { margin: 0 0 4px; font-size: 12px; font-weight: 600; color: var(--text-2); }
  .chart .box { position: relative; height: 210px; }
  .warn { color: var(--text-3); font-size: 11px; margin-top: 8px; }
  .err { color: var(--bad); font-size: 12px; margin: 0 0 8px; }
  .pos-table { width: 100%; border-collapse: collapse; }
  .pos-table th, .pos-table td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  .pos-table th { color: var(--text-2); font-weight: 500; font-size: 12px; }
  .pos-table td.n, .pos-table th.n { text-align: right; }
  .up { color: var(--good); } .down { color: var(--bad); }
  .rate { border: 1px dashed var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; display: flex; gap: 20px; flex-wrap: wrap; }
  .rate div { min-width: 120px; } .rate .v { font-size: 18px; font-weight: 600; } .rate .k { font-size: 11px; color: var(--text-2); }
  .empty { color: var(--text-3); font-size: 12px; padding: 24px 0; }
  details.tv summary { cursor: pointer; color: var(--text-2); font-size: 11px; margin-top: 4px; }
  details.tv table { font-size: 11px; color: var(--text-2); border-collapse: collapse; }
  details.tv td, details.tv th { padding: 1px 8px 1px 0; text-align: left; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>The Desk</h1>
      <div class="sub" id="updated">Loading…</div>
    </div>
    <div class="streak" title="Consecutive business days with a fully successful data update">
      <b id="streak">–</b><span>day update streak<br><span id="best"></span></span>
    </div>
  </header>
  <div id="banner"></div>
  <div class="toolbar" id="range"><span class="lbl">Range</span></div>

  <section class="card" id="positions"></section>
  <div id="panels"></div>
</div>

<script>
const DIR = new URLSearchParams(location.search).get('data') || 'data';
const RANGES = [['3M', 63], ['6M', 126], ['1Y', 252], ['All', 1e9]];
let rangeN = 252;
const D = {};           // loaded json
const charts = [];      // live Chart instances
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (v, d = 2) => v == null ? '–' : Number(v).toLocaleString('en-GB', {minimumFractionDigits: d, maximumFractionDigits: d});
const first = x => Array.isArray(x) ? x[0] : x;
const asOf = x => Array.isArray(x) ? x[1] : '';

async function load(name) {
  if (window.__DESK_DATA__) return window.__DESK_DATA__[name] ?? null;   // single-file build (works from file://)
  try { const r = await fetch(`${DIR}/${name}.json`, {cache: 'no-store'}); if (!r.ok) throw new Error(r.status); return await r.json(); }
  catch (e) { return null; }
}

/* ---------- chart helpers ---------- */
const crosshair = { id: 'crosshair', afterDatasetsDraw(c) {
  const a = c.tooltip?.getActiveElements?.(); if (!a || !a.length) return;
  const x = a[0].element.x, {top, bottom} = c.chartArea, g = c.ctx;
  g.save(); g.strokeStyle = css('--text-3'); g.lineWidth = 1; g.setLineDash([3, 3]);
  g.beginPath(); g.moveTo(x, top); g.lineTo(x, bottom); g.stroke(); g.restore();
}};

function cut(pairs) { return pairs.slice(-Math.min(rangeN, pairs.length)); }

/* datasets: [{label, pairs:[[date,val]], color, step?}] ; time-series line chart, single y axis */
function lineChart(canvas, datasets, {dec = 2, unit = '', zero = false, sets} = {}) {
  const cutd = datasets.map(d => ({...d, pairs: cut(d.pairs)}));
  const labels = [...new Set(cutd.flatMap(d => d.pairs.map(p => p[0])))].sort();
  const ds = cutd.map(d => { const m = new Map(d.pairs);
    return { label: d.label, data: labels.map(l => m.has(l) ? m.get(l) : null), borderColor: css(d.color), backgroundColor: css(d.color),
             borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, pointHoverBorderWidth: 2, pointHoverBorderColor: css('--surface'),
             tension: 0, spanGaps: true, stepped: d.step ? 'before' : false, borderDash: d.dash || [] }; });
  const ch = new Chart(canvas, { type: 'line', data: { labels, datasets: ds }, plugins: [crosshair],
    options: { responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: 'index', intersect: false },
      scales: { x: { ticks: { maxTicksLimit: 6, maxRotation: 0, color: css('--text-3'), font: {size: 10} }, grid: { display: false }, border: { color: css('--grid') } },
                y: { beginAtZero: zero, grace: '5%', ticks: { color: css('--text-3'), font: {size: 10}, callback: v => fmt(v, dec) }, grid: { color: css('--grid') }, border: { display: false } } },
      plugins: { legend: { display: ds.length > 1, position: 'bottom', labels: { color: css('--text-2'), boxWidth: 10, boxHeight: 3, font: {size: 11} } },
        tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${fmt(c.parsed.y, dec)}${unit}` } } } } });
  charts.push(ch); return ch;
}

function chartBox(title, id, tableHtml = '') {
  return `<div class="chart"><h3>${esc(title)}</h3><div class="box"><canvas id="${id}" role="img" aria-label="${esc(title)}"></canvas></div>${tableHtml}</div>`;
}
function tableView(datasets, dec = 2) {   // accessible table alternative: last 8 obs
  const rows = datasets[0].pairs.slice(-8).map((p, i) => `<tr><td>${p[0]}</td>${datasets.map(d => `<td>${fmt(d.pairs.slice(-8)[i]?.[1], dec)}</td>`).join('')}</tr>`).join('');
  return `<details class="tv"><summary>Table view</summary><table><tr><th>Date</th>${datasets.map(d => `<th>${esc(d.label)}</th>`).join('')}</tr>${rows}</table></details>`;
}
const tile = (k, v, sub = '') => `<div class="tile"><div class="v">${v}</div><div class="k">${esc(k)}${sub ? ' · ' + esc(sub) : ''}</div></div>`;

function rateBox(name, s) {
  if (!s) return '';
  const chg = s.days_since_change == null ? (s.note || 'no change in window')
    : `${s.days_since_change} days` ;
  const sub = s.last_change ? `${s.last_change_bp > 0 ? '+' : ''}${s.last_change_bp}bp on ${s.last_change}` : '';
  const nxt = s.next_meeting ? `${s.next_meeting} (in ${s.days_to_meeting}d)` : 'not set (meetings.json)';
  return `<div class="rate"><div><div class="v">${fmt(s.rate)}%</div><div class="k">${esc(name)} · as of ${s.as_of}</div></div>
    <div><div class="v">${chg}</div><div class="k">since last change ${esc(sub)}</div></div>
    <div><div class="v">${esc(nxt)}</div><div class="k">next scheduled meeting</div></div></div>`;
}

function panelShell(key, title, blurb) {
  const L = D.log, pl = L?.panels?.[key];
  const errs = [];
  if (pl && !pl.ok) errs.push(`Last update failed: ${pl.error} (showing previous data${pl.updated ? ' from ' + pl.updated.slice(0, 10) : ''}).`);
  const el = $(`<section class="card" id="p-${key}"><h2>${esc(title)}</h2>
    <p class="tp">${esc(L?.talking_points?.[key] || blurb)}</p>${errs.map(e => `<p class="err">${esc(e)}</p>`).join('')}<div class="body"></div></section>`);
  return el;
}
const warnHtml = (d) => d?.warnings?.length ? `<div class="warn">Notes: ${d.warnings.map(esc).join(' · ')}</div>` : '';

/* ---------- panels ---------- */
function drawKorea(el) {
  const d = D.korea_fx; if (!d) return missing(el);
  const L = d.latest;
  const kospiT = L.kospi_foreign_net ? tile('KOSPI foreign net buy', (first(L.kospi_foreign_net) >= 0 ? '+' : '') + fmt(first(L.kospi_foreign_net), 0), asOf(L.kospi_foreign_net)) : '';
  const hfT = L.hf_downloads ? tile('Korean LLM downloads (HF)', fmt(first(L.hf_downloads), 0), asOf(L.hf_downloads)) : '';
  el.innerHTML = `<div class="tiles">${tile('USD/KRW', fmt(L.usdkrw, 1), L.as_of)}${kospiT}${hfT}</div>
    ${d.bok ? rateBox('BoK base rate', d.bok) : ''}
    <div class="charts">${chartBox('USD/KRW spot', 'c-usdkrw', tableView([{label: 'USD/KRW', pairs: cut(d.series.usdkrw)}], 1))}
    ${d.series.bok_rate ? chartBox('BoK base rate (%), decisions only', 'c-bok') : ''}
    ${d.series.kospi_foreign_net ? chartBox('KOSPI foreign investor net buy/sell (daily)', 'c-kospi-foreign') : ''}
    ${d.series.hf_downloads ? chartBox('Korean LLM downloads on Hugging Face (daily snapshot)', 'c-hf') : ''}</div>${warnHtml(d)}`;
  const tg = Object.values(D.positions || {}).find(p => p.detail?.series === 'usdkrw' && p.detail?.target);
  const ch = lineChart(el.querySelector('#c-usdkrw'), [{label: 'USD/KRW', pairs: d.series.usdkrw, color: '--s1'}], {dec: 1});
  if (tg) addRefLines(ch, [['Entry', tg.detail.entry_level], ['Target', tg.detail.target]]);
  if (d.series.bok_rate) lineChart(el.querySelector('#c-bok'), [{label: 'BoK base rate', pairs: d.series.bok_rate, color: '--s1', step: true}], {unit: '%'});
  if (d.series.kospi_foreign_net) { const kf = cut(d.series.kospi_foreign_net);
    charts.push(new Chart(el.querySelector('#c-kospi-foreign'), { type: 'bar',
      data: { labels: kf.map(p => p[0]), datasets: [{ label: 'Net buy/sell', data: kf.map(p => p[1]),
        backgroundColor: kf.map(p => css(p[1] >= 0 ? '--good' : '--bad')), borderRadius: 2 }] },
      options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { display: false },
        tooltip: { callbacks: { label: c => ` ${c.parsed.y >= 0 ? '+' : ''}${fmt(c.parsed.y, 0)}` } } },
        scales: { x: { grid: { display: false }, ticks: { maxTicksLimit: 6, color: css('--text-3'), font: {size: 10} } },
                  y: { grid: { color: css('--grid') }, border: { display: false }, ticks: { color: css('--text-3'), font: {size: 10} } } } } })); }
  if (d.series.hf_downloads) lineChart(el.querySelector('#c-hf'), [{label: 'HF downloads', pairs: d.series.hf_downloads, color: '--s3'}], {dec: 0});
}
function addRefLines(ch, lines) {   // dashed horizontal reference lines (entry / target)
  ch.config.plugins.push({ id: 'refs' + Math.random(), afterDatasetsDraw(c) {
    const g = c.ctx, {left, right} = c.chartArea;
    lines.forEach(([t, v]) => { const y = c.scales.y.getPixelForValue(v); if (y < c.chartArea.top || y > c.chartArea.bottom) return;
      g.save(); g.strokeStyle = css('--text-3'); g.setLineDash([5, 4]); g.beginPath(); g.moveTo(left, y); g.lineTo(right, y); g.stroke();
      g.setLineDash([]); g.fillStyle = css('--text-2'); g.font = '10px system-ui'; g.fillText(`${t} ${fmt(v, 0)}`, left + 4, y - 3); g.restore(); }); } });
  ch.update('none');
}
function fomcRangePlugin(dp) {
  // Draws the real SEP distribution behind the median dots: a thin bar for the
  // full range (min-max across all participants) and a bolder bar for the
  // central tendency (middle ~70%, i.e. excluding the 3 highest and 3 lowest).
  // This is the closest thing to "the distribution" available without the raw
  // per-participant dots, which the Fed only publishes inside the SEP PDF's
  // appendix, not as structured/scrapable data.
  return { id: 'fomcRange' + Math.random(), beforeDatasetsDraw(c) {
    if (!dp) return;
    const g = c.ctx, ys = c.scales.y, xs = c.scales.x;
    Object.keys(dp.median).forEach(yr => {
      if (yr === 'longer run') return;
      const x = xs.getPixelForValue(`${yr}-12-31`);
      if (x == null || Number.isNaN(x)) return;
      const rng = dp.range?.[yr], ct = dp.central_tendency?.[yr];
      g.save();
      if (rng) { g.strokeStyle = css('--s2'); g.globalAlpha = 0.3; g.lineWidth = 3; g.lineCap = 'round';
        g.beginPath(); g.moveTo(x, ys.getPixelForValue(rng[0])); g.lineTo(x, ys.getPixelForValue(rng[1])); g.stroke(); }
      if (ct) { g.strokeStyle = css('--s2'); g.globalAlpha = 0.6; g.lineWidth = 8; g.lineCap = 'round';
        g.beginPath(); g.moveTo(x, ys.getPixelForValue(ct[0])); g.lineTo(x, ys.getPixelForValue(ct[1])); g.stroke(); }
      g.restore();
    });
  }};
}
function drawFedDotChart(canvas, d) {
  // The x-axis here is categorical (evenly-spaced by index, not real calendar
  // time - Chart.js needs a date adapter for a true time scale, not loaded in
  // this bundle), so mixing ~250 daily history points with a handful of future
  // dot-plot points would squash those future years together at the far edge.
  // The effective rate barely moves between meetings anyway, so thinning history
  // to roughly weekly loses no real information and gives the dots proportional
  // room; the most recent point is always kept so today's value stays exact.
  const histFull = cut(d.series.dff || []);
  const hist = histFull.filter((_, i) => i % 5 === 0 || i === histFull.length - 1);
  const dp = d.dot_plot;
  const yrs = dp ? Object.keys(dp.median).filter(y => y !== 'longer run') : [];
  const dots = yrs.map(y => [`${y}-12-31`, dp.median[y]]);
  // Hidden (invisible) datasets carrying the range bounds so Chart.js's own
  // auto-scaling accounts for them - the plugin above draws the actual bars,
  // these just make sure the y-axis is tall enough to show them.
  const rangeLow = yrs.filter(y => dp.range?.[y]).map(y => [`${y}-12-31`, dp.range[y][0]]);
  const rangeHigh = yrs.filter(y => dp.range?.[y]).map(y => [`${y}-12-31`, dp.range[y][1]]);
  const labels = [...new Set([...hist.map(p => p[0]), ...dots.map(p => p[0])])].sort();
  const histMap = new Map(hist), dotMap = new Map(dots), loMap = new Map(rangeLow), hiMap = new Map(rangeHigh);
  const ch = new Chart(canvas, { type: 'line', plugins: [crosshair, fomcRangePlugin(dp)],
    data: { labels, datasets: [
      { label: 'Fed funds (effective)', data: labels.map(l => histMap.has(l) ? histMap.get(l) : null),
        borderColor: css('--s1'), backgroundColor: css('--s1'), borderWidth: 2, pointRadius: 0, pointHoverRadius: 4,
        pointHoverBorderWidth: 2, pointHoverBorderColor: css('--surface'), tension: 0, spanGaps: true, stepped: 'before' },
      { label: 'FOMC dot plot (median)', data: labels.map(l => dotMap.has(l) ? dotMap.get(l) : null),
        borderColor: css('--s2'), backgroundColor: css('--s2'), borderWidth: 0, pointRadius: 5, pointHoverRadius: 6,
        showLine: false, spanGaps: false },
      { label: '_rangeLow', data: labels.map(l => loMap.has(l) ? loMap.get(l) : null), pointRadius: 0, borderWidth: 0, showLine: false },
      { label: '_rangeHigh', data: labels.map(l => hiMap.has(l) ? hiMap.get(l) : null), pointRadius: 0, borderWidth: 0, showLine: false } ] },
    options: { responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: 'index', intersect: false },
      scales: { x: { ticks: { maxTicksLimit: 6, maxRotation: 0, color: css('--text-3'), font: {size: 10} }, grid: { display: false }, border: { color: css('--grid') } },
                y: { grace: '10%', ticks: { color: css('--text-3'), font: {size: 10}, callback: v => fmt(v, 2) + '%' }, grid: { color: css('--grid') }, border: { display: false } } },
      plugins: { legend: { position: 'bottom', labels: { color: css('--text-2'), boxWidth: 10, boxHeight: 3, font: {size: 11}, filter: item => !item.text.startsWith('_') } },
        tooltip: { filter: item => !item.dataset.label.startsWith('_'),
          callbacks: { label: c => {
            const yr = c.label.slice(0, 4);
            const ct = dp?.central_tendency?.[yr], rng = dp?.range?.[yr];
            if (c.dataset.label === 'FOMC dot plot (median)' && (ct || rng)) {
              return [` Median: ${fmt(c.parsed.y, 2)}%`,
                ct ? ` Central tendency: ${fmt(ct[0], 2)}-${fmt(ct[1], 2)}%` : '',
                rng ? ` Range: ${fmt(rng[0], 2)}-${fmt(rng[1], 2)}%` : ''].filter(Boolean);
            }
            return ` ${c.dataset.label}: ${fmt(c.parsed.y, 2)}%`;
          } } } } } });
  charts.push(ch);
}
function drawUS(el) {
  const d = D.us_rates; if (!d) return missing(el);
  const L = d.latest, dp = d.dot_plot;
  const dotCaption = dp ? `FOMC median path (${dp.release_date}): ${Object.entries(dp.median).map(([y, v]) => `${y} ${fmt(v, 2)}%`).join(' · ')}. `
    + `Dot = median; bold bar = central tendency (middle ~70% of participants); light bar = full range. `
    + `Individual participant dots aren't published as structured data, only in the SEP PDF's appendix.` : '';
  el.innerHTML = `<div class="tiles">${tile('UST 2Y', fmt(first(L.ust2)) + '%', asOf(L.ust2))}${tile('UST 10Y', fmt(first(L.ust10)) + '%', asOf(L.ust10))}${L.ust30 ? tile('UST 30Y', fmt(first(L.ust30)) + '%', asOf(L.ust30)) : ''}
    ${tile('2s10s', fmt(L.curve_2s10s_bp, 0) + 'bp')}${L.cpi_yoy ? tile('CPI YoY', fmt(first(L.cpi_yoy)) + '%', asOf(L.cpi_yoy)) : ''}${L.core_pce_yoy ? tile('Core PCE YoY', fmt(first(L.core_pce_yoy)) + '%', asOf(L.core_pce_yoy)) : ''}</div>
    ${rateBox('Fed funds (effective)', d.fed)}
    <div class="charts">${chartBox('UST 2Y / 10Y' + (d.series.ust30 ? ' / 30Y' : '') + ' yield (%)', 'c-ust')}${chartBox('2s10s curve slope (bp)', 'c-curve')}
    ${d.series.cpi_yoy ? chartBox('Inflation, year-on-year (%): CPI, core CPI, PCE, core PCE', 'c-cpi',
      '<div class="warn">CPI (BLS): tracks a fixed basket of goods/services from a consumer survey. '
      + 'PCE (BEA, the Fed\'s preferred gauge, used for its 2% target): broader coverage and reweights '
      + 'as spending shifts between goods, so it typically runs a bit below CPI. "Core" excludes food '
      + 'and energy in both.</div>') : ''}
    ${d.series.dff ? chartBox('Fed funds rate & FOMC dot plot (median)', 'c-feddot', dotCaption ? `<div class="warn">${esc(dotCaption)}</div>` : '') : ''}</div>${warnHtml(d)}`;
  lineChart(el.querySelector('#c-ust'), [{label: '2Y', pairs: d.series.ust2, color: '--s1'}, {label: '10Y', pairs: d.series.ust10, color: '--s2'},
    ...(d.series.ust30 ? [{label: '30Y', pairs: d.series.ust30, color: '--s3'}] : [])], {unit: '%'});
  lineChart(el.querySelector('#c-curve'), [{label: '2s10s', pairs: d.series.curve_2s10s_bp, color: '--s1'}], {dec: 0, unit: 'bp'});
  if (d.series.cpi_yoy) lineChart(el.querySelector('#c-cpi'), [
    {label: 'CPI', pairs: d.series.cpi_yoy, color: '--s1'},

function filterHorizon(pairs, key) {

  else { from = new Date(last); from.setUTCMonth(from.getUTCMonth() - {'1m': 1, '3m': 3, '6m': 6, '1y': 12}[key]); }
  return pairs.filter(p => new Date(p[0]) >= from);
}

  sec.innerHTML = `<h2>Paper trades</h2><p class="tp">Hypothetical P&amp;L against the latest level. Edit <code>positions.json</code> to change theses.</p>

}
