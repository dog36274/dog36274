  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);

  .sub { color: var(--text-2); font-size: 12px; }
  .streak { display: flex; align-items: baseline; gap: 8px; background: var(--surface); border: 1px solid var(--border);
            border-radius: 12px; padding: 8px 16px; }
  .streak b { font-size: 34px; font-variant-numeric: tabular-nums; line-height: 1; }
  .streak span { color: var(--text-2); font-size: 12px; }

  .toolbar { display: flex; gap: 6px; margin: 0 0 12px; align-items: center; flex-wrap: wrap; }
  .toolbar .lbl { color: var(--text-2); font-size: 12px; margin-right: 4px; }
  button { font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border);

  button[aria-pressed="true"] { color: var(--text); border-color: var(--text-3); font-weight: 600; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .card h2 { margin: 0 0 2px; font-size: 16px; }
  .tp { color: var(--text-2); margin: 0 0 12px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .tile { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
  .tile .v { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile .k { font-size: 11px; color: var(--text-2); }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }

const DIR = new URLSearchParams(location.search).get('data') || 'data';
const RANGES = [['3M', 63], ['6M', 126], ['1Y', 252], ['All', 1e9]];
let rangeN = 252;
const D = {};           // loaded json
const charts = [];      // live Chart instances
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const first = x => Array.isArray(x) ? x[0] : x;
const asOf = x => Array.isArray(x) ? x[1] : '';

async function load(name) {
  if (window.__DESK_DATA__) return window.__DESK_DATA__[name] ?? null;   // single-file build (works from file://)
  try { const r = await fetch(`${DIR}/${name}.json`, {cache: 'no-store'}); if (!r.ok) throw new Error(r.status); return await r.json(); }
  catch (e) { return null; }
}

/* ---------- chart helpers ---------- */
const crosshair = { id: 'crosshair', afterDatasetsDraw(c) {
  const a = c.tooltip?.getActiveElements?.(); if (!a || !a.length) return;
  const x = a[0].element.x, {top, bottom} = c.chartArea, g = c.ctx;
  g.save(); g.strokeStyle = css('--text-3'); g.lineWidth = 1; g.setLineDash([3, 3]);
  g.beginPath(); g.moveTo(x, top); g.lineTo(x, bottom); g.stroke(); g.restore();
}};

function cut(pairs) { return pairs.slice(-Math.min(rangeN, pairs.length)); }

/* datasets: [{label, pairs:[[date,val]], color, step?}] ; time-series line chart, single y axis */
function lineChart(canvas, datasets, {dec = 2, unit = '', zero = false, sets} = {}) {
  const cutd = datasets.map(d => ({...d, pairs: cut(d.pairs)}));
  const labels = [...new Set(cutd.flatMap(d => d.pairs.map(p => p[0])))].sort();
  const ds = cutd.map(d => { const m = new Map(d.pairs);
    return { label: d.label, data: labels.map(l => m.has(l) ? m.get(l) : null), borderColor: css(d.color), backgroundColor: css(d.color),
             borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, pointHoverBorderWidth: 2, pointHoverBorderColor: css('--surface'),
             tension: 0, spanGaps: true, stepped: d.step ? 'before' : false, borderDash: d.dash || [] }; });
  const ch = new Chart(canvas, { type: 'line', data: { labels, datasets: ds }, plugins: [crosshair],
    options: { responsive: true, maintainAspectRatio: false, animation: false,
      interaction: { mode: 'index', intersect: false },
      scales: { x: { ticks: { maxTicksLimit: 6, maxRotation: 0, color: css('--text-3'), font: {size: 10} }, grid: { display: false }, border: { color: css('--grid') } },
                y: { beginAtZero: zero, grace: '5%', ticks: { color: css('--text-3'), font: {size: 10}, callback: v => fmt(v, dec) }, grid: { color: css('--grid') }, border: { display: false } } },
      plugins: { legend: { display: ds.length > 1, position: 'bottom', labels: { color: css('--text-2'), boxWidth: 10, boxHeight: 3, font: {size: 11} } },
        tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${fmt(c.parsed.y, dec)}${unit}` } } } } });
  charts.push(ch); return ch;
}

function chartBox(title, id, tableHtml = '') {
  return `<div class="chart"><h3>${esc(title)}</h3><div class="box"><canvas id="${id}" role="img" aria-label="${esc(title)}"></canvas></div>${tableHtml}</div>`;
}
function tableView(datasets, dec = 2) {   // accessible table alternative: last 8 obs
  const rows = datasets[0].pairs.slice(-8).map((p, i) => `<tr><td>${p[0]}</td>${datasets.map(d => `<td>${fmt(d.pairs.slice(-8)[i]?.[1], dec)}</td>`).join('')}</tr>`).join('');
  return `<details class="tv"><summary>Table view</summary><table><tr><th>Date</th>${datasets.map(d => `<th>${esc(d.label)}</th>`).join('')}</tr>${rows}</table></details>`;
}
const tile = (k, v, sub = '') => `<div class="tile"><div class="v">${v}</div><div class="k">${esc(k)}${sub ? ' · ' + esc(sub) : ''}</div></div>`;

function rateBox(name, s) {
  if (!s) return '';
  const chg = s.days_since_change == null ? (s.note || 'no change in window')
    : `${s.days_since_change} days` ;
  const sub = s.last_change ? `${s.last_change_bp > 0 ? '+' : ''}${s.last_change_bp}bp on ${s.last_change}` : '';
  const nxt = s.next_meeting ? `${s.next_meeting} (in ${s.days_to_meeting}d)` : 'not set (meetings.json)';
  return `<div class="rate"><div><div class="v">${fmt(s.rate)}%</div><div class="k">${esc(name)} · as of ${s.as_of}</div></div>
    <div><div class="v">${chg}</div><div class="k">since last change ${esc(sub)}</div></div>
    <div><div class="v">${esc(nxt)}</div><div class="k">next scheduled meeting</div></div></div>`;
}

function panelShell(key, title, blurb) {

  const el = $(`<section class="card" id="p-${key}"><h2>${esc(title)}</h2>

}
const warnHtml = (d) => d?.warnings?.length ? `<div class="warn">Notes: ${d.warnings.map(esc).join(' · ')}</div>` : '';

/* ---------- panels ---------- */
function drawKorea(el) {

  const tg = Object.values(D.positions || {}).find(p => p.detail?.series === 'usdkrw' && p.detail?.target);
  const ch = lineChart(el.querySelector('#c-usdkrw'), [{label: 'USD/KRW', pairs: d.series.usdkrw, color: '--s1'}], {dec: 1});
  if (tg) addRefLines(ch, [['Entry', tg.detail.entry_level], ['Target', tg.detail.target]]);
  if (d.series.bok_rate) lineChart(el.querySelector('#c-bok'), [{label: 'BoK base rate', pairs: d.series.bok_rate, color: '--s1', step: true}], {unit: '%'});
  if (d.series.kospi_foreign_net) { const kf = cut(d.series.kospi_foreign_net);
    charts.push(new Chart(el.querySelector('#c-kospi-foreign'), { type: 'bar',
      data: { labels: kf.map(p => p[0]), datasets: [{ label: 'Net buy/sell', data: kf.map(p => p[1]),
        backgroundColor: kf.map(p => css(p[1] >= 0 ? '--good' : '--bad')), borderRadius: 2 }] },
      options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { display: false },
        tooltip: { callbacks: { label: c => ` ${c.parsed.y >= 0 ? '+' : ''}${fmt(c.parsed.y, 0)}` } } },
        scales: { x: { grid: { display: false }, ticks: { maxTicksLimit: 6, color: css('--text-3'), font: {size: 10} } },
                  y: { grid: { color: css('--grid') }, border: { display: false }, ticks: { color: css('--text-3'), font: {size: 10} } } } } })); }
  if (d.series.hf_downloads) lineChart(el.querySelector('#c-hf'), [{label: 'HF downloads', pairs: d.series.hf_downloads, color: '--s3'}], {dec: 0});

function addRefLines(ch, lines) {   // dashed horizontal reference lines (entry / target)
  ch.config.plugins.push({ id: 'refs' + Math.random(), afterDatasetsDraw(c) {
    const g = c.ctx, {left, right} = c.chartArea;
    lines.forEach(([t, v]) => { const y = c.scales.y.getPixelForValue(v); if (y < c.chartArea.top || y > c.chartArea.bottom) return;
      g.save(); g.strokeStyle = css('--text-3'); g.setLineDash([5, 4]); g.beginPath(); g.moveTo(left, y); g.lineTo(right, y); g.stroke();
      g.setLineDash([]); g.fillStyle = css('--text-2'); g.font = '10px system-ui'; g.fillText(`${t} ${fmt(v, 0)}`, left + 4, y - 3); g.restore(); }); } });
  ch.update('none');
}
function drawFedDotChart(canvas, d) {

        borderColor: css('--s1'), backgroundColor: css('--s1'), borderWidth: 2, pointRadius: 0, pointHoverRadius: 4,
        pointHoverBorderWidth: 2, pointHoverBorderColor: css('--surface'), tension: 0, spanGaps: true, stepped: 'before' },
      { label: 'FOMC dot plot (median)', data: labels.map(l => dotMap.has(l) ? dotMap.get(l) : null),
        borderColor: css('--s2'), backgroundColor: css('--s2'), borderWidth: 0, pointRadius: 5, pointHoverRadius: 6,
        showLine: false, spanGaps: false } ] },
    options: { responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: 'index', intersect: false },
      scales: { x: { ticks: { maxTicksLimit: 6, maxRotation: 0, color: css('--text-3'), font: {size: 10} }, grid: { display: false }, border: { color: css('--grid') } },
                y: { grace: '10%', ticks: { color: css('--text-3'), font: {size: 10}, callback: v => fmt(v, 2) + '%' }, grid: { color: css('--grid') }, border: { display: false } } },
      plugins: { legend: { position: 'bottom', labels: { color: css('--text-2'), boxWidth: 10, boxHeight: 3, font: {size: 11} } },
        tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${fmt(c.parsed.y, 2)}%` } } } } });

function drawUS(el) {
  const d = D.us_rates; if (!d) return missing(el);
  const L = d.latest, dp = d.dot_plot;

  el.innerHTML = `<div class="tiles">${tile('UST 2Y', fmt(first(L.ust2)) + '%', asOf(L.ust2))}${tile('UST 10Y', fmt(first(L.ust10)) + '%', asOf(L.ust10))}${L.ust30 ? tile('UST 30Y', fmt(first(L.ust30)) + '%', asOf(L.ust30)) : ''}

    ${d.series.dff ? chartBox('Fed funds rate & FOMC dot plot (median)', 'c-feddot', dotCaption ? `<div class="warn">${esc(dotCaption)}</div>` : '') : ''}</div>${warnHtml(d)}`;

    ...(d.series.core_cpi_yoy ? [{label: 'Core CPI', pairs: d.series.core_cpi_yoy, color: '--s1', dash: [6, 3]}] : []),

/* Gold vs inverted 10Y real yield: dual-axis by deliberate choice (not the usual single-
   axis rule) - the two series live on different units but have a well-known inverse
   macro relationship, and a shared, inverted secondary axis is the standard way this
   specific comparison is charted. Each axis auto-fits to its own filtered series (via
   `grace`), so the two lines span a comparable share of the chart height regardless of
   their absolute units. */
const HZ_OPTIONS = [['1M', '1m'], ['3M', '3m'], ['6M', '6m'], ['1Y', '1y'], ['YTD', 'ytd']];
let goldHorizon = '1y', goldChart = null, goldCorrChart = null;
let nokOilHorizon = '1y', nokOilChart = null, nokOilCorrChart = null;
function filterHorizon(pairs, key) {
  if (!pairs || !pairs.length) return [];
  const last = new Date(pairs[pairs.length - 1][0]);
  let from;
  if (key === 'ytd') { from = new Date(Date.UTC(last.getUTCFullYear(), 0, 1)); }
  else { from = new Date(last); from.setUTCMonth(from.getUTCMonth() - {'1m': 1, '3m': 3, '6m': 6, '1y': 12}[key]); }
  return pairs.filter(p => new Date(p[0]) >= from);
}
function drawGoldRealChart(canvas, d) {
  if (goldChart) { const i = charts.indexOf(goldChart); if (i >= 0) charts.splice(i, 1); goldChart.destroy(); }
  const gold = filterHorizon(d.series.gold, goldHorizon), real = filterHorizon(d.series.real10, goldHorizon);
  const labels = [...new Set([...gold, ...real].map(p => p[0]))].sort();
  const gm = new Map(gold), rm = new Map(real);
  goldChart = new Chart(canvas, { type: 'line', plugins: [crosshair],
    data: { labels, datasets: [
      { label: 'Gold (USD/oz)', data: labels.map(l => gm.has(l) ? gm.get(l) : null), yAxisID: 'y',
        borderColor: css('--s1'), backgroundColor: css('--s1'), borderWidth: 2, pointRadius: 0, pointHoverRadius: 4,
        pointHoverBorderWidth: 2, pointHoverBorderColor: css('--surface'), tension: 0, spanGaps: true },
      { label: '10Y real yield (inverted)', data: labels.map(l => rm.has(l) ? rm.get(l) : null), yAxisID: 'y1',
        borderColor: css('--s2'), backgroundColor: css('--s2'), borderWidth: 2, pointRadius: 0, pointHoverRadius: 4,
        pointHoverBorderWidth: 2, pointHoverBorderColor: css('--surface'), tension: 0, spanGaps: true } ] },
    options: { responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: 'index', intersect: false },
      scales: {
        x: { ticks: { maxTicksLimit: 6, maxRotation: 0, color: css('--text-3'), font: {size: 10} }, grid: { display: false }, border: { color: css('--grid') } },
        y: { position: 'left', grace: '10%', ticks: { color: css('--s1'), font: {size: 10}, callback: v => '$' + fmt(v, 0) },
             grid: { color: css('--grid') }, border: { display: false } },
        y1: { position: 'right', reverse: true, grace: '10%', ticks: { color: css('--s2'), font: {size: 10}, callback: v => fmt(v, 2) + '%' },
             grid: { display: false }, border: { display: false } } },
      plugins: { legend: { position: 'bottom', labels: { color: css('--text-2'), boxWidth: 10, boxHeight: 3, font: {size: 11} } },
        tooltip: { callbacks: { label: c => c.dataset.yAxisID === 'y' ? ` Gold: $${fmt(c.parsed.y, 0)}` : ` Real yield: ${fmt(c.parsed.y, 2)}%` } } } } });
  charts.push(goldChart);
}
const WGC_SERIES = [
  ['jewellery_fabrication', 'Jewellery fabrication', '--s1'],
  ['investment', 'Investment', '--s2'],
  ['central_banks_and_other_institutions', 'Central banks & other institutions', '--s3'],
];
function drawGoldCorrChart(canvas, d) {
  if (goldCorrChart) { const i = charts.indexOf(goldCorrChart); if (i >= 0) charts.splice(i, 1); goldCorrChart.destroy(); }
  const corr = filterHorizon(d.series.corr60, goldHorizon);
  goldCorrChart = new Chart(canvas, { type: 'line', plugins: [crosshair],

    options: { responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: 'index', intersect: false },

      scales: { x: { stacked: true, grid: { display: false }, ticks: { maxTicksLimit: 10, color: css('--text-3'), font: {size: 10} } },

function drawGold(el) {

    <div class="chart">

/* NOK/EUR vs Brent: same dual-axis-by-deliberate-choice reasoning as gold vs real
   yields above - a petrocurrency and the commodity it tracks, different units, each
   axis auto-fit to its own filtered range so both read at a comparable scale. Not
   inverted (unlike gold/real yields): NOK typically strengthens *with* oil, not
   against it. */
function drawNokOilChart(canvas, d) {
  if (nokOilChart) { const i = charts.indexOf(nokOilChart); if (i >= 0) charts.splice(i, 1); nokOilChart.destroy(); }
  const nok = filterHorizon(d.series.nok_eur, nokOilHorizon), oil = filterHorizon(d.series.oil, nokOilHorizon);
  const labels = [...new Set([...nok, ...oil].map(p => p[0]))].sort();
  const nm = new Map(nok), om = new Map(oil);
  nokOilChart = new Chart(canvas, { type: 'line', plugins: [crosshair],
    data: { labels, datasets: [
      { label: 'NOK/EUR', data: labels.map(l => nm.has(l) ? nm.get(l) : null), yAxisID: 'y',
        borderColor: css('--s1'), backgroundColor: css('--s1'), borderWidth: 2, pointRadius: 0, pointHoverRadius: 4,
        pointHoverBorderWidth: 2, pointHoverBorderColor: css('--surface'), tension: 0, spanGaps: true },
      { label: 'Brent crude (USD/bbl)', data: labels.map(l => om.has(l) ? om.get(l) : null), yAxisID: 'y1',
        borderColor: css('--s2'), backgroundColor: css('--s2'), borderWidth: 2, pointRadius: 0, pointHoverRadius: 4,
        pointHoverBorderWidth: 2, pointHoverBorderColor: css('--surface'), tension: 0, spanGaps: true } ] },
    options: { responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: 'index', intersect: false },
      scales: {
        x: { ticks: { maxTicksLimit: 6, maxRotation: 0, color: css('--text-3'), font: {size: 10} }, grid: { display: false }, border: { color: css('--grid') } },
        y: { position: 'left', grace: '10%', ticks: { color: css('--s1'), font: {size: 10}, callback: v => fmt(v, 4) },
             grid: { color: css('--grid') }, border: { display: false } },
        y1: { position: 'right', grace: '10%', ticks: { color: css('--s2'), font: {size: 10}, callback: v => '$' + fmt(v, 0) },
             grid: { display: false }, border: { display: false } } },
      plugins: { legend: { position: 'bottom', labels: { color: css('--text-2'), boxWidth: 10, boxHeight: 3, font: {size: 11} } },
        tooltip: { callbacks: { label: c => c.dataset.yAxisID === 'y' ? ` NOK/EUR: ${fmt(c.parsed.y, 4)}` : ` Brent: $${fmt(c.parsed.y, 2)}` } } } } });
  charts.push(nokOilChart);
}
function drawNokOilCorrChart(canvas, d) {
  if (nokOilCorrChart) { const i = charts.indexOf(nokOilCorrChart); if (i >= 0) charts.splice(i, 1); nokOilCorrChart.destroy(); }
  const corr = filterHorizon(d.series.corr60, nokOilHorizon);
  nokOilCorrChart = new Chart(canvas, { type: 'line', plugins: [crosshair],
    data: { labels: corr.map(p => p[0]), datasets: [{ label: '60d correlation', data: corr.map(p => p[1]),
      borderColor: css('--s3'), backgroundColor: css('--s3'), borderWidth: 2, pointRadius: 0, pointHoverRadius: 4,
      pointHoverBorderWidth: 2, pointHoverBorderColor: css('--surface'), tension: 0, spanGaps: true }] },
    options: { responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: 'index', intersect: false },
      scales: { x: { ticks: { maxTicksLimit: 6, maxRotation: 0, color: css('--text-3'), font: {size: 10} }, grid: { display: false }, border: { color: css('--grid') } },
                y: { min: -1, max: 1, ticks: { color: css('--text-3'), font: {size: 10}, callback: v => fmt(v, 1) }, grid: { color: css('--grid') }, border: { display: false } } },
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ` Correlation: ${fmt(c.parsed.y, 2)}` } } } } });
  charts.push(nokOilCorrChart);
}
function drawNokOil(el) {
  const d = D.nok_oil; if (!d) return missing(el);
  const L = d.latest;
  el.innerHTML = `<div class="tiles">${tile('NOK/EUR', fmt(first(L.nok_eur), 4), asOf(L.nok_eur))}${tile('Brent crude', '$' + fmt(first(L.oil), 2), asOf(L.oil))}${tile('60d correlation', L.corr60 == null ? '–' : fmt(L.corr60))}</div>
    <div class="chart">
      <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px">
        <h3 style="margin:0">NOK/EUR vs Brent crude (secondary axis)</h3>
        <div class="toolbar" id="nokoil-hz" style="margin:0"></div>
      </div>
      <div class="box"><canvas id="c-nokoil" role="img" aria-label="NOK/EUR vs Brent crude"></canvas></div>
    </div>
    <div class="charts">${chartBox('Rolling 60-day correlation (NOK/EUR vs Brent, daily % returns)', 'c-nokoil-corr')}</div>
    <div class="warn">${esc(d.corr_method)}</div>${warnHtml(d)}`;
  const hzEl = el.querySelector('#nokoil-hz');
  HZ_OPTIONS.forEach(([lbl, key]) => { const b = $(`<button aria-pressed="${key === nokOilHorizon}">${lbl}</button>`);
    b.onclick = () => { nokOilHorizon = key; hzEl.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
      drawNokOilChart(el.querySelector('#c-nokoil'), d); drawNokOilCorrChart(el.querySelector('#c-nokoil-corr'), d); };
    hzEl.appendChild(b); });
  drawNokOilChart(el.querySelector('#c-nokoil'), d);
  drawNokOilCorrChart(el.querySelector('#c-nokoil-corr'), d);
}
function drawUK(el) {
  const d = D.uk_gilts; if (!d) return missing(el);
  const L = d.latest, ons = d.ons || {}, dmo = d.dmo || {};
  const onsT = Object.entries(ons).map(([k, o]) => tile(k.replace(/_/g, ' '), '£' + fmt(o.latest / 1000, 1) + 'bn', o.as_of.slice(0, 7))).join('');
  const dmoT = [['Remit £bn', dmo.remit_gbp_bn], ['Gilts in issue £bn', dmo.gilts_in_issue_gbp_bn]].filter(x => x[1] != null).map(([k, v]) => tile('DMO ' + k, fmt(v, 0))).join('');
  const curve = d.curve || {};
  const has30 = Object.values(curve).some(c => c['30y'] != null);
  const tenors = has30 ? ['5y', '10y', '20y', '30y'] : ['5y', '10y', '20y'];
  el.innerHTML = `<div class="tiles">${tile('Gilt 10Y par yield', fmt(first(L.gilt10)) + '%', asOf(L.gilt10))}${onsT}${dmoT}</div>
    ${rateBox('BoE Bank Rate', d.boe)}
    <div class="charts">${chartBox('Gilt yield curve (par yields, %)', 'c-curve')}${chartBox('10Y gilt par yield (%)', 'c-g10')}${chartBox('Bank Rate (%), decisions only', 'c-br')}
    ${ons.psnb_ex_banks ? chartBox('PSNB ex banks (£m, monthly)', 'c-psnb') : ''}</div>
    ${dmo.remit_gbp_bn == null ? '<div class="warn">DMO remit / gilts in issue: fill in data/dmo_manual.json.</div>' : ''}${warnHtml(d)}`;
  const cols = ['--s1', '--s2', '--s3'];
  charts.push(new Chart(el.querySelector('#c-curve'), { type: 'line', plugins: [crosshair],
    data: { labels: tenors, datasets: Object.entries(curve).map(([k, c], i) => ({ label: `${k} (${c.date})`, data: tenors.map(t => c[t]),
      borderColor: css(cols[i]), backgroundColor: css(cols[i]), borderWidth: 2, pointRadius: 3 })) },
    options: { responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: 'index', intersect: false },
      scales: { x: { grid: { display: false }, ticks: { color: css('--text-3'), font: {size: 10} } }, y: { grace: '5%', grid: { color: css('--grid') }, border: { display: false }, ticks: { color: css('--text-3'), font: {size: 10}, callback: v => fmt(v) } } },
      plugins: { legend: { position: 'bottom', labels: { color: css('--text-2'), boxWidth: 10, boxHeight: 3, font: {size: 11} } }, tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${fmt(c.parsed.y)}%` } } } } }));
  lineChart(el.querySelector('#c-g10'), [{label: '10Y gilt', pairs: d.series.gilt10, color: '--s1'}], {unit: '%'});
  lineChart(el.querySelector('#c-br'), [{label: 'Bank Rate', pairs: d.series.bank_rate, color: '--s1', step: true}], {unit: '%'});
  if (ons.psnb_ex_banks) { const s = ons.psnb_ex_banks.series;
    charts.push(new Chart(el.querySelector('#c-psnb'), { type: 'bar', data: { labels: s.map(p => p[0].slice(0, 7)), datasets: [{ label: 'PSNB ex', data: s.map(p => p[1]), backgroundColor: css('--s1'), borderRadius: 3 }] },
      options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { display: false } },
        scales: { x: { grid: { display: false }, ticks: { maxTicksLimit: 6, color: css('--text-3'), font: {size: 10} } }, y: { grid: { color: css('--grid') }, border: { display: false }, ticks: { color: css('--text-3'), font: {size: 10} } } } } })); }
}
function missing(el) { el.innerHTML = '<div class="empty">No data yet. Run the update workflow.</div>'; }

/* ---------- positions ---------- */
function drawPositions() {
  const sec = document.getElementById('positions'), P = D.log?.positions || {};
  const rows = Object.entries(P).map(([k, p]) => {
    const dt = p.detail || {};
    if (p.pnl_pct == null) return `<tr><td>${esc(k)}</td><td colspan="6">${esc(dt.view || p.note || '')}${dt.entry_date ? ' <span class="sub">(since ' + esc(dt.entry_date) + ')</span>' : ''}</td></tr>`;
    const cls = p.pnl_pct >= 0 ? 'up' : 'down', sg = v => (v >= 0 ? '+' : '') + v;
    return `<tr><td>${esc(k)}</td><td>${esc(dt.direction)}</td><td class="n">${fmt(dt.entry_level, 0)}</td><td class="n">${fmt(p.current, 1)}</td>
      <td class="n">${dt.target ? fmt(dt.target, 0) : '–'}</td><td class="n">${p.progress_to_target_pct != null ? fmt(p.progress_to_target_pct, 0) + '%' : '–'}</td>
      <td class="n ${cls}">${sg(fmt(p.pnl_pct))}%${p.pnl_usd != null ? ' / ' + (p.pnl_usd >= 0 ? '+' : '−') + '$' + fmt(Math.abs(p.pnl_usd), 0) : ''}</td></tr>`; }).join('');
  sec.innerHTML = `<h2>Paper trades</h2><p class="tp">Hypothetical P&amp;L against the latest level. Edit <code>positions.json</code> to change theses.</p>
    ${rows ? `<div style="overflow-x:auto"><table class="pos-table"><tr><th>Position</th><th>Dir</th><th class="n">Entry</th><th class="n">Now</th><th class="n">Target</th><th class="n">To target</th><th class="n">P&amp;L</th></tr>${rows}</table></div>` : '<div class="empty">No positions.</div>'}`;
}

/* ---------- render ---------- */
const PANELS = [['korea_fx', 'Korea FX', 'USD/KRW and the Bank of Korea', drawKorea], ['us_rates', 'US Rates & the Fed', '', drawUS],
  ['gold_real_yields', 'Gold & Real Yields', '', drawGold], ['frontier', 'Frontier Markets', '', drawFrontier],
  ['nok_oil', 'NOK/EUR & Oil', '', drawNokOil], ['uk_gilts', 'UK Gilts', '', drawUK]];

function render() {
  charts.splice(0).forEach(c => c.destroy());
  goldChart = null; goldCorrChart = null; nokOilChart = null; nokOilCorrChart = null;
  const host = document.getElementById('panels'); host.innerHTML = '';
  drawPositions();
  for (const [key, title, blurb, fn] of PANELS) { const el = panelShell(key, title, blurb); host.appendChild(el); fn(el.querySelector('.body')); }
}
function header() {
  const L = D.log;
  document.getElementById('streak').textContent = L ? L.streak : '–';
  document.getElementById('best').textContent = L?.best_streak ? `best ${L.best_streak}` : '';
  document.getElementById('updated').textContent = L ? `Last run ${L.last_run.replace('T', ' ').slice(0, 16)} UTC${L.all_ok ? '' : ' · some panels failed'}` : 'No data yet';
  if (L?.demo) document.getElementById('banner').innerHTML = '<div class="banner"><b>Demo mode:</b> synthetic data for layout preview only.</div>';
}
(async function init() {
  const rb = document.getElementById('range');
  RANGES.forEach(([lbl, n]) => { const b = $(`<button aria-pressed="${n === rangeN}">${lbl}</button>`);
    b.onclick = () => { rangeN = n; rb.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); render(); }; rb.appendChild(b); });
  const names = [...PANELS.map(([key]) => key), 'log'];   // derived from PANELS so adding a panel there is enough
  const res = await Promise.all(names.map(load)); names.forEach((n, i) => D[n] = res[i]);
  D.positions = D.log?.positions; header(); render();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
})();
</script>
</body>
</html>
